name: Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: 'Rust version to use'
        required: false
        type: string
        default: 'stable'
      cargo-features:
        description: 'Cargo features to enable (e.g., --all-features)'
        required: false
        type: string
        default: '--all-features'
      skip-build-matrix:
        description: 'Skip the cross-platform build matrix job'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy

      - name: Run lint checks
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-lint@main
        with:
          clippy-args: '--all-targets ${{ inputs.cargo-features }} -- -D warnings'

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          cache-key: test-linux

      - name: Run tests
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-test@main
        with:
          test-args: '--verbose ${{ inputs.cargo-features }}'

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          cache-key: test-macos

      - name: Run tests
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-test@main
        with:
          test-args: '--verbose ${{ inputs.cargo-features }}'

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          cache-key: test-windows

      - name: Run tests
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-test@main
        with:
          test-args: '--verbose ${{ inputs.cargo-features }}'

  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    needs: test-linux
    if: ${{ !inputs.skip-build-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: x86_64-unknown-linux-gnu
          cache-key: build-linux

      - name: Build
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-build@main
        with:
          target: x86_64-unknown-linux-gnu
          profile: release
          features: ${{ inputs.cargo-features }}

  build-macos:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    needs: test-macos
    if: ${{ !inputs.skip-build-matrix }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: ${{ matrix.target }}
          cache-key: build-${{ matrix.target }}

      - name: Build
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-build@main
        with:
          target: ${{ matrix.target }}
          profile: release
          features: ${{ inputs.cargo-features }}

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    needs: test-windows
    if: ${{ !inputs.skip-build-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: x86_64-pc-windows-msvc
          cache-key: build-windows

      - name: Build
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-build@main
        with:
          target: x86_64-pc-windows-msvc
          profile: release
          features: ${{ inputs.cargo-features }}
