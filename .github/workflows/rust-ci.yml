name: Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: 'Rust version to use'
        required: false
        type: string
        default: 'stable'
      cargo-features:
        description: 'Cargo features to enable (e.g., --all-features)'
        required: false
        type: string
        default: '--all-features'
      skip-build-matrix:
        description: 'Skip the cross-platform build matrix job'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy

      - name: Run lint checks
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-lint@main
        with:
          clippy-args: '--all-targets ${{ inputs.cargo-features }} -- -D warnings'

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          cache-key: test-${{ matrix.os }}

      - name: Build
        run: cargo build --verbose ${{ inputs.cargo-features }}

      - name: Run tests
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-test@main
        with:
          test-args: '--verbose ${{ inputs.cargo-features }}'

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.skip-build-matrix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: ${{ matrix.target }}
          cache-key: build-${{ matrix.target }}

      - name: Build
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-build@main
        with:
          target: ${{ matrix.target }}
          profile: release
          features: ${{ inputs.cargo-features }}

      - name: Test binary (if binary crate)
        continue-on-error: true
        run: cargo run --release --target ${{ matrix.target }} -- --version
