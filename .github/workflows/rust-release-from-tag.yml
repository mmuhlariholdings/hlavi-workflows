name: Rust Release from Tag

on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to release (e.g., v0.1.4 or v0.1.4-pr.123)'
        required: true
        type: string
      binary-name:
        description: 'Binary name to build (optional, for binary crates)'
        required: false
        type: string
      create-draft-release:
        description: 'Create draft release instead of publishing immediately'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'GitHub token for creating releases'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: ${{ inputs.binary-name != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-build@main
        with:
          target: ${{ matrix.target }}
          profile: release
          binary-name: ${{ inputs.binary-name }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ inputs.binary-name }}-${{ inputs.tag }}-${{ matrix.target }}.tar.gz ${{ inputs.binary-name }}
          mv ${{ inputs.binary-name }}-${{ inputs.tag }}-${{ matrix.target }}.tar.gz ${{ github.workspace }}/

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ inputs.binary-name }}-${{ inputs.tag }}-${{ matrix.target }}.zip ${{ inputs.binary-name }}.exe
          mv ${{ inputs.binary-name }}-${{ inputs.tag }}-${{ matrix.target }}.zip ${{ github.workspace }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary-name }}-${{ matrix.target }}
          path: ${{ inputs.binary-name }}-${{ inputs.tag }}-${{ matrix.target }}.*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download artifacts
        if: ${{ inputs.binary-name != '' }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (Draft)
        if: ${{ inputs.create-draft-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          # Create release
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.tag }}" \
            --generate-notes \
            --draft

          # Upload binaries if they exist
          if [ -d "artifacts" ]; then
            find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec gh release upload "${{ inputs.tag }}" {} \;
          fi

          echo "✅ Draft release created: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}"

      - name: Create GitHub Release (Published)
        if: ${{ !inputs.create-draft-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          # Create release
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.tag }}" \
            --generate-notes

          # Upload binaries if they exist
          if [ -d "artifacts" ]; then
            find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec gh release upload "${{ inputs.tag }}" {} \;
          fi

          echo "✅ Release created: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}"
