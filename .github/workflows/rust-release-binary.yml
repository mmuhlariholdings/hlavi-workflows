name: Rust Release Binary

on:
  workflow_call:
    inputs:
      binary-name:
        description: 'Name of the binary to build (e.g., hlavi)'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact file (e.g., hlavi or hlavi.exe)'
        required: false
        type: string
        default: ''
      include-arm64-linux:
        description: 'Include ARM64 Linux build'
        required: false
        type: boolean
        default: true
    secrets:
      github-token:
        description: 'GitHub token for uploading release assets'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  get-release:
    name: Get Release Info
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
      release_id: ${{ steps.get_release.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get existing release
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }})
          echo "upload_url=$(echo $RELEASE_DATA | jq -r .upload_url)" >> $GITHUB_OUTPUT
          echo "id=$(echo $RELEASE_DATA | jq -r .id)" >> $GITHUB_OUTPUT

  build-and-upload:
    name: Build and Upload (${{ matrix.target }})
    needs: get-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ${{ inputs.artifact-name || inputs.binary-name }}
            asset_name: ${{ inputs.binary-name }}-$TARGET-linux-amd64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ${{ inputs.artifact-name || inputs.binary-name }}
            asset_name: ${{ inputs.binary-name }}-$TARGET-linux-arm64.tar.gz
            skip: ${{ !inputs.include-arm64-linux }}
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ${{ inputs.artifact-name || inputs.binary-name }}
            asset_name: ${{ inputs.binary-name }}-$TARGET-darwin-amd64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ${{ inputs.artifact-name || inputs.binary-name }}
            asset_name: ${{ inputs.binary-name }}-$TARGET-darwin-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ${{ inputs.artifact-name || format('{0}.exe', inputs.binary-name) }}
            asset_name: ${{ inputs.binary-name }}-$TARGET-windows-amd64.zip

    steps:
      - name: Skip if needed
        if: matrix.skip
        run: echo "Skipping this build" && exit 0

      - name: Checkout code
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4

      - name: Setup Rust
        if: ${{ !matrix.skip }}
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/setup-rust@main
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && !matrix.skip
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        if: ${{ !matrix.skip }}
        uses: mmuhlariholdings/hlavi-workflows/.github/actions/rust-build@main
        with:
          target: ${{ matrix.target }}
          profile: release

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest' && !matrix.skip
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }} ../../..
        env:
          TARGET: ${{ needs.get-release.outputs.version }}

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest' && !matrix.skip
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }} ../../..
        env:
          TARGET: ${{ needs.get-release.outputs.version }}

      - name: Upload Release Asset
        if: ${{ !matrix.skip }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        with:
          upload_url: ${{ needs.get-release.outputs.upload_url }}
          asset_path: ./${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/gzip

  finalize:
    name: Finalize Release
    needs: [get-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "✅ All binaries built and uploaded successfully"
          echo "📦 Release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.get-release.outputs.version }}"
