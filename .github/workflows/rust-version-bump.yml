name: Rust Version Bump

on:
  workflow_call:
    inputs:
      version-type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        type: string
      custom-version:
        description: 'Custom version (optional, overrides version-type)'
        required: false
        type: string
      package-name:
        description: 'Package name for cargo update (e.g., hlavi-core)'
        required: true
        type: string
      create-draft-release:
        description: 'Create draft release instead of publishing immediately'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'GitHub token for creating releases'
        required: true

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.new_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Determine new version
        id: new_version
        run: |
          if [ -n "${{ inputs.custom-version }}" ]; then
            NEW_VERSION="${{ inputs.custom-version }}"
            echo "Using custom version: $NEW_VERSION"
          else
            CURRENT="${{ steps.current_version.outputs.version }}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            case "${{ inputs.version-type }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bumped ${{ inputs.version-type }} version to: $NEW_VERSION"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION"

      - name: Update version in Cargo.toml
        run: |
          cargo set-version ${{ steps.new_version.outputs.version }}

      - name: Update Cargo.lock
        run: cargo update -p ${{ inputs.package-name }}

      - name: Commit version bump
        run: |
          git add Cargo.toml
          # Only add Cargo.lock if it's tracked (binary crates commit it, libraries don't)
          if git ls-files --error-unmatch Cargo.lock 2>/dev/null; then
            git add Cargo.lock
          fi
          git commit -m "release: bump version to ${{ steps.new_version.outputs.version }}"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Create GitHub Release (Draft)
        if: ${{ inputs.create-draft-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          gh release create "v${{ steps.new_version.outputs.version }}" \
            --title "Release v${{ steps.new_version.outputs.version }}" \
            --generate-notes \
            --draft

          echo "✅ Version bumped to v${{ steps.new_version.outputs.version }}"
          echo "✅ Tag created and pushed"
          echo "✅ Draft release created at: https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "The release workflow will now build binaries automatically."
          echo "Review and publish the release when binaries are attached."

      - name: Create GitHub Release (Published)
        if: ${{ !inputs.create-draft-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          gh release create "v${{ steps.new_version.outputs.version }}" \
            --title "Release v${{ steps.new_version.outputs.version }}" \
            --generate-notes

          echo "✅ Version bumped to v${{ steps.new_version.outputs.version }}"
          echo "✅ Tag created and pushed"
          echo "✅ Release created at: https://github.com/${{ github.repository }}/releases"
