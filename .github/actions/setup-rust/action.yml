name: 'Setup Rust'
description: 'Install Rust toolchain and configure caching'
inputs:
  toolchain:
    description: 'Rust toolchain version (stable, nightly, 1.75.0, etc.)'
    required: false
    default: 'stable'
  components:
    description: 'Additional components to install (e.g., rustfmt, clippy)'
    required: false
    default: ''
  targets:
    description: 'Additional targets to install (e.g., wasm32-unknown-unknown)'
    required: false
    default: ''
  cache-key:
    description: 'Additional cache key suffix for customizing cache'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
